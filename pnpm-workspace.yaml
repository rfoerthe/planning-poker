allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: true
overrides:
  # Security: gaxios@6 pins uuid@^9, which is affected by GHSA-w5hq-g745-h8pq.
  uuid@9: ^11.1.1
  # Security: @google-cloud/pubsub@5 pins @opentelemetry/core@^1, which is
  # affected by GHSA-8988-4f7v-96qf. It uses a single export from it,
  # W3CTraceContextPropagator, which v2 still provides unchanged.
  '@opentelemetry/core': ^2.8.0
