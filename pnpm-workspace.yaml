allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  re2: true
overrides:
  # Security: gaxios@6 pins uuid@^9, which is affected by GHSA-w5hq-g745-h8pq.
  uuid@9: ^11.1.1
  # Security: firebase-tools depends on @google-cloud/pubsub@^5, whose 5.x line
  # pins @opentelemetry/core@^1 and is therefore stuck on GHSA-8988-4f7v-96qf.
  # Pubsub 6 is the release that moves to @opentelemetry/core@^2.
  '@google-cloud/pubsub': ^6.0.1
  # Security: GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g. Some Express
  # dependencies pin qs exactly, so updating the lockfile alone is insufficient.
  qs@<6.16.0: 6.16.0
  # Security: GHSA-f596-whhp-79r4 and GHSA-m9gg-hp2v-232j. @firebase/firestore still
  # requests grpc-js 1.9; the override also dedupes google-gax onto the fixed release.
  # This is the only one of these paths that reaches the shipped bundle.
  '@grpc/grpc-js': ^1.14.5
  # Security: GHSA-rfgv-xxqx-mfg5, GHSA-xjj6-f33q-929c and three more; firebase-tools
  # asks for undici ^6.19.0, and the 6.x line is fixed from 6.29.1 on. The 7.x copy
  # from jsdom and the 8.x copy from node-gyp resolve to fixed releases on their own.
  undici@6: ^6.29.1
  # Security: GHSA-mrhx-c7xc-m3w5; firebase-tools and the MCP SDK both ask for zod ^4.
  zod: ^4.6.6
  # Security: GHSA-27r3-jxmh-p828 on both body-parser lines: 1.x via firebase-tools,
  # exegesis and Express 4, 2.x via the MCP SDK's Express 5.
  body-parser@1: ^1.20.9
  body-parser@2: ^2.4.0
  # Security: GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p;
  # brace-expansion 5 arrives through minimatch 10 via rimraf's glob 13. The
  # legacy 1.x and 2.x lines reach fixed releases within their parents' ranges.
  brace-expansion@5: ^5.0.12
